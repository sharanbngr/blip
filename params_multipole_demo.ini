[params]
## Fast demonstration config for the ell-collapsed anisotropic SGWB models.
## This is meant to run quickly and show the outputs / parameter names / plots.

fmin=3e-4
fmax=2e-3
duration=3e5
seglen=1e5
fs=0.25

## Keep the response cheap for a quick sanity check.
nside=2
tstart = 0
lisa_config=orbiting
tdi_lev=xyz
load_data=0
datatype=strain
fref = 25

## Recover a single ell-collapsed multipole component.
## Swap sph_l2 -> sph_l1, sph_l3, ... to test other angular scales.
## To test summed components, use e.g.
## model=noise+powerlaw_sph_l1+powerlaw_sph_l2
model=noise+powerlaw_sph_l2

alias={}

## Keep lmax/inj_lmax equal to the largest ell you want to probe in this file.
lmax = 2


[inj]
doInj=1

## Matching injection so you can see the new model recover itself.
## As above, this can be changed to multiple components if desired.
injection=noise+powerlaw_sph_l2
inj_lmax=2

## For sph_lN models the amplitude parameter is Bell (or B).
## The model string determines which ell that amplitude belongs to.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
	    'powerlaw_sph_l2':{'alpha':0.667,'Bell':1e-7}
	   }


[run_params]
## Small sampler settings so this finishes quickly.
sampler=dynesty
nlive=250
sample_method=rslice
Nthreads=1

## Always regenerate the demo data in this dedicated directory.
doPreProc=1
input_spectrum=multipole_demo_spectrum.npz

FixSeed=1
seed=42

projection=E
colormap=magma
checkpoint=0

out_dir=./Storage/multipole_demo_l2/
