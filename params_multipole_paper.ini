[params]
## Publication-grade starting point for ell-collapsed anisotropic SGWB runs.
## This file is set up for a single ell at a time, which is the intended use
## for these models in sensitivity-to-angular-scale studies.

fmin=2e-4
fmax=5e-3
## One Julian year of data for strong orbital modulation.
duration=3.15576e7
seglen=1e5
fs=0.25

## Higher sky resolution than the fast demo run.
nside=4
tstart = 0
lisa_config=orbiting
tdi_lev=xyz
load_data=0
datatype=strain
fref = 25

## Active analysis model.
## Duplicate this file and replace sph_l2 with sph_l1, sph_l3, ... for the
## one-multipole-at-a-time study to be reported in a paper.
## If you explicitly want a summed model, use for example
## model=noise+powerlaw_sph_l1+powerlaw_sph_l2+powerlaw_sph_l3
model=noise+powerlaw_sph_l2

alias={}

## Set these to at least the largest ell in the active model/injection strings.
lmax = 2


[inj]
## Keep this as an injection/recovery config for end-to-end validation plots.
## For a real data analysis, set doInj=0 and point BLIP at the external data.
doInj=1
injection=noise+powerlaw_sph_l2
inj_lmax=2

## This amplitude is intentionally moderate rather than extreme so the recovery
## is representative of a realistic validation study.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
	    'powerlaw_sph_l2':{'alpha':0.667,'Bell':5e-8}
	   }


[run_params]
## Robust nested-sampling settings suitable for figures/tables in a paper.
sampler=dynesty
nlive=3000
sample_method=rslice
Nthreads=4

## Regenerate the exact same mock data each time unless you change the seed.
doPreProc=1
input_spectrum=multipole_paper_spectrum.npz

FixSeed=1
seed=42

projection=E
colormap=magma

## Turn checkpointing on for long runs.
checkpoint=1
checkpoint_interval=1800

out_dir=./Storage/multipole_paper_l2/
